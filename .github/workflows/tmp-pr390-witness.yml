name: Temporary PR390 witness verification

on:
  push:
    branches:
      - verify/pr390-current-main-witness

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: LearnerAI
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install pinned native parser
        run: python -m pip install "git+https://github.com/joerollman/aoe2-ai-parser.git@3dfa2583b7c2ec36b85ccb421ebd0abe9ff276ba"
      - name: Focused late-objective regression
        run: python -m unittest LearnerAI.Compiler.tests.test_byzantine_defensive_geometry -v
      - name: Checked-in Byzantine native zero
        run: python LearnerAI/Compiler/tests/assert_native_zero.py Byzantine.per --report /tmp/byzantine-root.json
      - name: Canonical Byzantine build
        run: python tools/build_byzantine_bot.py
      - name: Canonical artifact native zero
        run: python LearnerAI/Compiler/tests/assert_native_zero.py dist/byzantine/Byzantine.per --report /tmp/byzantine-dist.json
      - name: Full compiler regression
        run: python -m unittest discover -s LearnerAI/Compiler/tests -p "test_*.py"
