name: DUC target consumer full regression

on:
  push:
    branches:
      - compiler-duc-target-consumer

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run full compiler test suite
        run: python -m unittest discover -s LearnerAI/Compiler/tests -p "test_*.py"
