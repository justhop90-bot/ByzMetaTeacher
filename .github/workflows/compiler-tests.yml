name: Compiler tests

on:
  push:
    paths:
      - "LearnerAI/Compiler/**"
      - ".github/workflows/compiler-tests.yml"
  pull_request:
    paths:
      - "LearnerAI/Compiler/**"
      - ".github/workflows/compiler-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s LearnerAI/Compiler/tests -p "test_*.py"
