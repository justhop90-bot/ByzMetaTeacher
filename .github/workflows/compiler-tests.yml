name: Compiler tests

on:
  push:
    paths:
      - "LearnerAI/Compiler/**"
      - ".github/workflows/compiler-tests.yml"
  pull_request:
    paths:
      - "LearnerAI/Compiler/**"
      - ".github/workflows/compiler-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned native parser
        run: python -m pip install "git+https://github.com/joerollman/aoe2-ai-parser.git@3dfa2583b7c2ec36b85ccb421ebd0abe9ff276ba"
      - name: Native zero-findings acceptance - generated Basilisk fixture
        run: python LearnerAI/Compiler/tests/assert_native_zero.py LearnerAI/Compiler/generated/Basilisk.per
      - name: Native zero-findings acceptance - strategy vertical-slice fixture
        run: |
          python - <<'PY'
          from pathlib import Path
          from LearnerAI.Compiler.compiler import compile_strategy_profile
          from LearnerAI.Compiler.ir.civ_profile import ByzantineProfile, resolve_effective_civ
          from LearnerAI.Compiler.ir.strategy import build_byzantine_castle_strategy

          effective = resolve_effective_civ(ByzantineProfile.for_update_185872())
          profile = build_byzantine_castle_strategy(effective)
          Path("/tmp/basilisk-strategy.per").write_text(
              compile_strategy_profile(profile, effective),
              encoding="utf-8",
          )
          PY
          python LearnerAI/Compiler/tests/assert_native_zero.py /tmp/basilisk-strategy.per
      - name: Native zero-findings acceptance - strategy-runtime fixture
        run: |
          python - <<'PY'
          from pathlib import Path
          from LearnerAI.Compiler.compiler import compile_strategy_runtime_profile
          from LearnerAI.Compiler.ir.civ_profile import ByzantineProfile, resolve_effective_civ
          from LearnerAI.Compiler.ir.strategy import build_byzantine_castle_strategy, StrategyPosture
          from LearnerAI.Compiler.ir.strategy_runtime import RuntimeObservationSnapshot

          effective = resolve_effective_civ(ByzantineProfile.for_update_185872())
          profile = build_byzantine_castle_strategy(effective)
          snapshot = RuntimeObservationSnapshot(
              fact_results=(
                  ("(current-age >= feudal-age)", True),
                  ("(building-available castle)", True),
                  ("(can-afford-building castle)", False),
                  ("(can-build castle)", False),
                  ("(current-age >= imperial-age)", False),
                  ("(players-unit-type-count any-enemy knight >= 3)", False),
              ),
              previous_posture=StrategyPosture.BOOM,
          )
          Path("/tmp/basilisk-strategy-runtime.per").write_text(
              compile_strategy_runtime_profile(profile, effective, snapshot),
              encoding="utf-8",
          )
          PY
          python LearnerAI/Compiler/tests/assert_native_zero.py /tmp/basilisk-strategy-runtime.per
      - name: Native zero-findings acceptance - explicit invalidation fixture
        run: |
          python - <<'PY'
          from pathlib import Path
          from LearnerAI.Compiler.compiler import compile_source
          source = """
          demand castle {
              require (can-build castle)
              action (build castle)
              witness (building-type-count castle > 0)
              release (building-type-count castle > 0)
              invalidate (not (building-available castle))
          }
          """
          Path("/tmp/basilisk-invalidation.per").write_text(
              compile_source(source),
              encoding="utf-8",
          )
          PY
          python LearnerAI/Compiler/tests/assert_native_zero.py /tmp/basilisk-invalidation.per
      - run: python -m unittest discover -s LearnerAI/Compiler/tests -p "test_*.py"
