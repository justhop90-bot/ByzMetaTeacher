name: Compiler tests
# Authoritative compiler acceptance workflow. Legacy validators are not acceptance gates.
# Timer allocation tranche verification remains pinned to this workflow.

on:
  push:
    branches:
      - main
    paths:
      - "LearnerAI/Compiler/**"
      - ".github/workflows/compiler-tests.yml"
  pull_request:
    paths:
      - "LearnerAI/Compiler/**"
      - ".github/workflows/compiler-tests.yml"
  workflow_dispatch:

concurrency:
  group: compiler-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  cross-platform-native-support:
    name: Native-support determinism (${{ matrix.os }}, Python ${{ matrix.python-version }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Generate native support determinism snapshot
        run: python LearnerAI/Compiler/tests/assert_native_support_determinism.py --output native-support-replay.json
      - uses: actions/upload-artifact@v7
        with:
          name: native-support-replay-${{ matrix.os }}-${{ matrix.python-version }}
          path: native-support-replay.json
          if-no-files-found: error
          retention-days: 14

  compare-cross-platform-native-support:
    name: Compare native-support snapshots
    needs: cross-platform-native-support
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v8
        with:
          pattern: native-support-replay-*
          path: snapshots
          merge-multiple: false
      - name: Compare Python and OS snapshots
        run: python LearnerAI/Compiler/tests/compare_native_support_replays.py --root snapshots

  test:
    name: Compiler tests + native zero-findings
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: LearnerAI
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Initialize compiler verification log
        shell: bash
        run: echo -n > compiler-tests.log
      - name: Install pinned native parser
        run: python -m pip install "git+https://github.com/joerollman/aoe2-ai-parser.git@3dfa2583b7c2ec36b85ccb421ebd0abe9ff276ba"
      - name: Verify native parser import
        run: |
          python -c "import aoe2_ai_lab; print('aoe2-ai-parser import: OK')"
      - name: Verify generic compiler fixture reproducibility
        run: python LearnerAI/Compiler/tests/assert_generated_fixture_reproducible.py --output /tmp/CompilerFixture.per
      - name: Native zero-findings acceptance - freshly compiled generic compiler fixture
        run: python LearnerAI/Compiler/tests/assert_native_zero.py /tmp/CompilerFixture.per --report /tmp/native-reports/compiler-fixture.json
      - name: Native zero-findings acceptance - strategy vertical-slice fixture
        run: |
          python - <<'PY'
          from pathlib import Path
          from LearnerAI.Compiler.clients.basilisk import compile_strategy_profile
          from LearnerAI.Compiler.ir.civ_profile import resolve_effective_civ
          from LearnerAI.Compiler.clients.basilisk import ByzantineProfile, build_byzantine_castle_strategy

          effective = resolve_effective_civ(ByzantineProfile.for_update_185872())
          profile = build_byzantine_castle_strategy(effective)
          Path("/tmp/basilisk-strategy.per").write_text(
              compile_strategy_profile(profile, effective),
              encoding="utf-8",
          )
          PY
          python LearnerAI/Compiler/tests/assert_native_zero.py /tmp/basilisk-strategy.per --report /tmp/native-reports/strategy.json
      - name: Native zero-findings acceptance - strategy-runtime fixture
        run: |
          python - <<'PY'
          from pathlib import Path
          from LearnerAI.Compiler.clients.basilisk import compile_strategy_runtime_profile
          from LearnerAI.Compiler.ir.civ_profile import ByzantineProfile, resolve_effective_civ
          from LearnerAI.Compiler.clients.basilisk import build_byzantine_castle_strategy, StrategyPosture
          from LearnerAI.Compiler.clients.basilisk import RuntimeObservationSnapshot

          effective = resolve_effective_civ(ByzantineProfile.for_update_185872())
          profile = build_byzantine_castle_strategy(effective)
          snapshot = RuntimeObservationSnapshot(
              fact_results=(
                  ("(current-age >= feudal-age)", True),
                  ("(building-available castle)", True),
                  ("(can-afford-building castle)", False),
                  ("(can-build castle)", False),
                  ("(current-age >= imperial-age)", False),
                  ("(players-unit-type-count any-enemy knight >= 3)", False),
              ),
              previous_posture=StrategyPosture.BOOM,
          )
          Path("/tmp/basilisk-strategy-runtime.per").write_text(
              compile_strategy_runtime_profile(profile, effective, snapshot),
              encoding="utf-8",
          )
          PY
          python LearnerAI/Compiler/tests/assert_native_zero.py /tmp/basilisk-strategy-runtime.per --report /tmp/native-reports/strategy-runtime.json
      - name: Native zero-findings acceptance - strategic number semantics fixture
        run: |
          python LearnerAI/Compiler/tests/assert_strategic_number_native.py             --output /tmp/strategic-number.per             --report /tmp/native-reports/strategic-number.json
      - name: Native zero-findings acceptance - native Strategic Number reference fixture
        run: |
          python LearnerAI/Compiler/tests/assert_native_strategic_number_reference.py             --output /tmp/native-strategic-number-reference.per             --report /tmp/native-reports/native-strategic-number-reference.json
      - name: Native zero-findings acceptance - construction lifecycle fixture
        run: |
          python - <<'PY'
          from pathlib import Path
          from LearnerAI.Compiler.compiler import compile_source
          source = """
          demand castle {
              require (can-build castle)
              action (build castle)
              witness (building-type-count castle > 0)
              release (building-type-count castle > 0)
          }
          """
          Path("/tmp/construction-lifecycle.per").write_text(
              compile_source(source),
              encoding="utf-8",
          )
          PY
          python LearnerAI/Compiler/tests/assert_native_zero.py /tmp/construction-lifecycle.per --report /tmp/native-reports/construction-lifecycle.json

      - name: Native zero-findings acceptance - DUC binder/emission fixture
        run: |
          python LearnerAI/Compiler/tests/assert_duc_native.py             --output /tmp/duc-binder-emission.per             --report /tmp/native-reports/duc-binder-emission.json

      - name: Native zero-findings acceptance - DUC target reacquisition fixture
        run: |
          python LearnerAI/Compiler/tests/assert_duc_target_reacquisition_native.py \
            --output /tmp/duc-target-reacquisition.per \
            --report /tmp/native-reports/duc-target-reacquisition.json

      - name: Native zero-findings acceptance - DUC group window fixture
        run: |
          python LearnerAI/Compiler/tests/assert_duc_group_window_native.py \
            --output /tmp/duc-group-window.per \
            --report /tmp/native-reports/duc-group-window.json

      - name: Native zero-findings acceptance - unit alias fixture
        run: |
          python LearnerAI/Compiler/tests/assert_native_unit_alias_native.py \
            --output /tmp/unit-alias.per \
            --report /tmp/native-reports/unit-alias.json

      - name: Native zero-findings acceptance - strategy goal-state fixture
        run: |
          python LearnerAI/Compiler/tests/assert_strategy_goal_state_native.py \
            --output /tmp/strategy-goal-state.per \
            --report /tmp/native-reports/strategy-goal-state.json

      - name: Native zero-findings acceptance - strategy production vertical
        run: |
          python LearnerAI/Compiler/tests/assert_strategy_production_vertical_native.py \
            --output /tmp/strategy-production.per \
            --report /tmp/native-reports/strategy-production.json

      - name: Native zero-findings acceptance - attack lifecycle fixture
        run: |
          python LearnerAI/Compiler/tests/assert_attack_native.py             --output /tmp/attack-lifecycle.per             --report /tmp/native-reports/attack-lifecycle.json

      - name: Native zero-findings acceptance - escrow release lowering fixture
        run: |
          python LearnerAI/Compiler/tests/assert_escrow_native.py             --output /tmp/escrow-release.per             --report /tmp/native-reports/escrow-release.json

      - name: Native zero-findings acceptance - research escrow claim fixture
        run: |
          python LearnerAI/Compiler/tests/assert_research_escrow_native.py             --output /tmp/research-escrow.per             --report /tmp/native-reports/research-escrow.json

      - name: Native zero-findings acceptance - escrow percentage policy fixture
        run: |
          python LearnerAI/Compiler/tests/assert_escrow_policy_native.py             --output /tmp/escrow-policy.per             --report /tmp/native-reports/escrow-policy.json

      - name: Native zero-findings acceptance - Timer allocation fixture
        run: |
          python LearnerAI/Compiler/tests/assert_timer_native.py             --output /tmp/timer-allocation.per             --manifest /tmp/timer-allocation-binding.json             --report /tmp/native-reports/timer-allocation.json

      - name: Native zero-findings acceptance - Production queue capacity fixture
        run: |
          python LearnerAI/Compiler/tests/assert_production_queue_capacity_native.py \
            --output /tmp/production-queue-capacity.per \
            --report /tmp/native-reports/production-queue-capacity.json

      - name: Native zero-findings acceptance - Production provider readiness fixture
        run: |
          python LearnerAI/Compiler/tests/assert_production_provider_readiness_native.py \
            --output /tmp/production-provider-readiness.per \
            --report /tmp/native-reports/production-provider-readiness.json

      - name: Native zero-findings acceptance - Production birth and queue-exit timing fixture
        run: |
          python LearnerAI/Compiler/tests/assert_production_birth_queue_exit_timing_native.py \
            --output /tmp/production-birth-queue-exit-timing.per \
            --report /tmp/native-reports/production-birth-queue-exit-timing.json

      - name: Native zero-findings acceptance - Production arbitration fixture
        run: |
          python LearnerAI/Compiler/tests/assert_production_arbitration_native.py \
            --output /tmp/production-arbitration.per \
            --report /tmp/native-reports/production-arbitration.json

      - name: Native zero-findings acceptance - Research in-progress fixture
        run: |
          python LearnerAI/Compiler/tests/assert_research_in_progress_native.py             --output /tmp/research-in-progress.per             --report /tmp/native-reports/research-in-progress.json

      - name: Focused Timer allocation regression
        run: |
          python -m unittest LearnerAI/Compiler/tests/test_timer_allocation.py

      - name: Native zero-findings acceptance - explicit invalidation fixture
        run: |
          python - <<'PY'
          from pathlib import Path
          from LearnerAI.Compiler.compiler import compile_source
          source = """
          demand castle {
              require (can-build castle)
              action (build castle)
              witness (building-type-count castle > 0)
              release (building-type-count castle > 0)
              invalidate (not (building-available castle))
          }
          """
          Path("/tmp/basilisk-invalidation.per").write_text(
              compile_source(source),
              encoding="utf-8",
          )
          PY
          python LearnerAI/Compiler/tests/assert_native_zero.py /tmp/basilisk-invalidation.per --report /tmp/native-reports/invalidation.json
      - name: Upload native validation evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: native-validation-evidence
          path: |
            /tmp/native-reports
            /tmp/CompilerFixture.per
            /tmp/basilisk-strategy.per
            /tmp/basilisk-strategy-runtime.per
            /tmp/basilisk-invalidation.per
            /tmp/construction-lifecycle.per
            /tmp/strategic-number.per
            /tmp/duc-binder-emission.per
            /tmp/attack-lifecycle.per
            /tmp/escrow-release.per
            /tmp/research-escrow.per
            /tmp/escrow-policy.per
            /tmp/timer-allocation.per
            /tmp/timer-allocation-binding.json
            /tmp/research-in-progress.per
          if-no-files-found: warn
          retention-days: 14

      - name: Run focused persistent-state regression suite
        shell: bash
        run: |
          set -o pipefail
          python -m unittest discover -s LearnerAI/Compiler/tests -p "test_*.py" -k "PersistentStateSemanticsTests" 2>&1 | tee focused-persistent-state-tests.log
          python -m unittest discover -s LearnerAI/Compiler/tests -p "test_*.py" -k "RuleDiagnosticsTests" 2>&1 | tee -a focused-persistent-state-tests.log
          python -m unittest discover -s LearnerAI/Compiler/tests -p "test_*.py" -k "RuleExecutionSemanticsTests" 2>&1 | tee -a focused-persistent-state-tests.log
      - name: Upload focused persistent-state verification log
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: focused-persistent-state-verification-log
          path: focused-persistent-state-tests.log
          if-no-files-found: error
          retention-days: 14
      - name: Focused military composition proof regression
        run: python -m unittest LearnerAI/Compiler/tests/test_military_composition_proof.py
      - name: Run compiler regression suite
        shell: bash
        run: |
          set -o pipefail
          python -m unittest discover -s LearnerAI/Compiler/tests -p "test_*.py" 2>&1 | tee compiler-tests.log
      - name: Upload compiler verification log
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: compiler-verification-log
          path: compiler-tests.log
          if-no-files-found: error
          retention-days: 14

  verification-gate:
    name: Compiler verification gate
    if: ${{ always() }}
    needs:
      - test
      - compare-cross-platform-native-support
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Record verification result
        if: ${{ always() }}
        shell: bash
        run: |
          test_result="${{ needs.test.result }}"
          replay_result="${{ needs['compare-cross-platform-native-support'].result }}"
          {
            echo "## Compiler verification gate"
            echo ""
            echo "- Compiler tests + native zero-findings: ${test_result}"
            echo "- Cross-platform native-support comparison: ${replay_result}"
            echo "- Native parser: pinned commit 3dfa2583b7c2ec36b85ccb421ebd0abe9ff276ba"
            if [ "${test_result}" = "success" ] && [ "${replay_result}" = "success" ]; then
              echo "- Result: PASSED"
            else
              echo "- Result: FAILED"
            fi
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Enforce required verification jobs
        run: |
          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "Compiler test/native zero-findings job did not pass."
            exit 1
          fi
          if [ "${{ needs['compare-cross-platform-native-support'].result }}" != "success" ]; then
            echo "Cross-platform native-support comparison did not pass."
            exit 1
          fi