name: Compiler tests

on:
  push:
    paths:
      - "LearnerAI/Compiler/**"
      - ".github/workflows/compiler-tests.yml"
  pull_request:
    paths:
      - "LearnerAI/Compiler/**"
      - ".github/workflows/compiler-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned native parser
        run: python -m pip install "git+https://github.com/joerollman/aoe2-ai-parser.git@3dfa2583b7c2ec36b85ccb421ebd0abe9ff276ba"
      - name: Native-validate generated Basilisk fixture
        run: python -m aoe2_ai_lab lint LearnerAI/Compiler/generated/Basilisk.per --profile default --json
      - run: python -m unittest discover -s LearnerAI/Compiler/tests -p "test_*.py"
