name: Byzantine .per semantic audit

on:
  pull_request:
    paths:
      - "Byzantine.per"
      - ".github/workflows/byzantine-per-semantic-audit.yml"

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install pinned AoE2 AI parser
        run: python -m pip install "git+https://github.com/joerollman/aoe2-ai-parser.git@3dfa2583b7c2ec36b85ccb421ebd0abe9ff276ba"
      - name: Run pinned parser
        shell: bash
        run: |
          set +e
          python -m aoe2_ai_lab lint Byzantine.per 2>&1 | tee byzantine-parser.log
          status=${PIPESTATUS[0]}
          echo "parser_exit_code=${status}"
          exit ${status}
      - name: Upload parser evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: byzantine-per-audit-evidence
          path: byzantine-parser.log
          if-no-files-found: error
          retention-days: 14
