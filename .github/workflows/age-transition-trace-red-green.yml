name: age-transition-trace-red-green

on:
  push:
    branches:
      - feat/age-transition-runtime-trace

jobs:
  focused:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: LearnerAI
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install pinned native parser
        run: python -m pip install "git+https://github.com/joerollman/aoe2-ai-parser.git@3dfa2583b7c2ec36b85ccb421ebd0abe9ff276ba"
      - name: Focused age-transition trace test
        run: python -m unittest LearnerAI.Compiler.tests.test_byzantine_runtime_sync.ByzantineRuntimeVoiceStorageIsolationTests.test_synchronization_installs_age_transition_runtime_trace -v
