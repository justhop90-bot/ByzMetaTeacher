name: Verify patched Byzantine artifact
on:
  push:
    branches:
      - verify/byzantine-dark-age-mining-native
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Reconstruct patched artifact
        shell: bash
        run: |
          : > /tmp/byzantine.per
          for part in verification/chunks/*.perpart; do
            cat "$part" >> /tmp/byzantine.per
            printf "\n" >> /tmp/byzantine.per
          done
          sha256sum /tmp/byzantine.per
          test "$(sha256sum /tmp/byzantine.per | cut -d' ' -f1)" = "78cbba8d7aa24d0e8af467970783fe4a07932ac86e6fd5ae8f216dff60d8024c"
      - name: Install pinned native parser
        run: python -m pip install "git+https://github.com/joerollman/aoe2-ai-parser.git@3dfa2583b7c2ec36b85ccb421ebd0abe9ff276ba"
      - name: Native parser twice and output determinism
        shell: bash
        run: |
          set +e
          python -m aoe2_ai_lab lint /tmp/byzantine.per --profile default --json > /tmp/native-1.json
          s1=$?
          python -m aoe2_ai_lab lint /tmp/byzantine.per --profile default --json > /tmp/native-2.json
          s2=$?
          set -e
          echo "first_exit=$s1"
          echo "second_exit=$s2"
          cat /tmp/native-1.json
          cat /tmp/native-2.json
          cmp -s /tmp/native-1.json /tmp/native-2.json
          test $s1 -eq 0
          test $s2 -eq 0
