name: Verified Byzantine export

on:
  pull_request:
    paths:
      - "Byzantine.per"
      - ".github/workflows/verified-byzantine-export.yml"

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: Byzantine-main-verified
          path: Byzantine.per
