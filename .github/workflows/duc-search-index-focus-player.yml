name: DUC focus-player lifecycle

on:
  push:
    branches:
      - compiler-duc-search-index-focus-player

jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Focus-player lifecycle red test
        run: |
          set -e
          PYTHONPATH=LearnerAI python -m unittest -v LearnerAI.Compiler.tests.test_duc_semantics.DucSemanticTests.test_focus_player_change_resets_remote_search_index
          PYTHONPATH=LearnerAI python -m unittest -v LearnerAI.Compiler.tests.test_duc_semantics.DucSemanticTests.test_focus_player_search_index_starts_at_native_default
          PYTHONPATH=LearnerAI python -m unittest -v LearnerAI.Compiler.tests.test_duc_semantics.DucSemanticTests.test_same_focus_player_assignment_does_not_reset_remote_index
          PYTHONPATH=LearnerAI python -m unittest -v LearnerAI.Compiler.tests.test_duc_semantics.DucSemanticTests.test_up_modify_sn_constant_assignment_resets_remote_index_and_tracks_provenance
          PYTHONPATH=LearnerAI python -m unittest -v LearnerAI.Compiler.tests.test_duc_semantics.DucSemanticTests.test_local_search_index_is_not_reset_by_focus_player_change
          PYTHONPATH=LearnerAI python -m unittest -v LearnerAI.Compiler.tests.test_duc_semantics.DucSemanticTests.test_dynamic_focus_player_mutation_resets_remote_index_but_preserves_unknown_value
          PYTHONPATH=LearnerAI python -m unittest -v LearnerAI.Compiler.tests.test_duc_semantics.DucSemanticTests.test_focus_player_provenance_survives_next_pass
          PYTHONPATH=LearnerAI python -m unittest -v LearnerAI.Compiler.tests.test_duc_semantics.DucSemanticTests.test_branch_divergence_makes_focus_player_context_ambiguous
