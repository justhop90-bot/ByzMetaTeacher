name: Byzantine exact parser audit

on:
  push:
    branches:
      - audit/byzantine-native-1170

jobs:
  parser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned parser
        run: python -m pip install "git+https://github.com/joerollman/aoe2-ai-parser.git@3dfa2583b7c2ec36b85ccb421ebd0abe9ff276ba"
      - name: Lint Byzantine.per
        run: python -m aoe2_ai_lab lint Byzantine.per
