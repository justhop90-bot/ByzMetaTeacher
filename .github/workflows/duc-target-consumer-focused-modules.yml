name: DUC target consumer focused modules

on:
  push:
    branches:
      - compiler-duc-target-consumer

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: DUC semantic tests
        run: PYTHONPATH=LearnerAI timeout 60s python -m unittest -v LearnerAI.Compiler.tests.test_duc_semantics
      - name: Native contract integration tests
        run: PYTHONPATH=LearnerAI timeout 60s python -m unittest -v LearnerAI.Compiler.tests.test_native_contract_integration
      - name: Native hygiene tests
        run: PYTHONPATH=LearnerAI timeout 60s python -m unittest -v LearnerAI.Compiler.tests.test_native_hygiene