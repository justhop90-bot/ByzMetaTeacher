name: DUC target consumer regression bisect

on:
  push:
    branches:
      - compiler-duc-target-consumer

jobs:
  bisect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run each compiler test module with timeout
        shell: bash
        run: |
          python - <<'PY'
          import os
          import subprocess
          import sys
          from pathlib import Path
          tests = sorted(Path('LearnerAI/Compiler/tests').glob('test_*.py'))
          failures = 0
          for path in tests:
              print(f'=== {path} ===', flush=True)
              try:
                  result = subprocess.run(
                      [sys.executable, '-m', 'unittest', 'discover', '-v', '-s', str(path.parent), '-p', path.name],
                      text=True,
                      capture_output=True,
                      timeout=30,
                      env=dict(os.environ, PYTHONPATH='LearnerAI'),
                  )
              except subprocess.TimeoutExpired as exc:
                  print(f'TIMEOUT: {path}', flush=True)
                  print((exc.stdout or '')[-4000:], flush=True)
                  failures += 1
                  continue
              print(result.stdout[-6000:], flush=True)
              print(result.stderr[-3000:], flush=True)
              if result.returncode != 0:
                  print(f'FAILURE: {path} rc={result.returncode}', flush=True)
                  failures += 1
          if failures:
              raise SystemExit(f'{failures} compiler test modules failed or timed out')
          PY