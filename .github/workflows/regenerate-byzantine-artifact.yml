name: Regenerate Byzantine artifact

on:
  push:
    branches:
      - sync/byzantine-per-endgame-20261005

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          ref: sync/byzantine-per-endgame-20261005

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install pinned native parser
        run: python -m pip install "git+https://github.com/joerollman/aoe2-ai-parser.git@3dfa2583b7c2ec36b85ccb421ebd0abe9ff276ba"

      - name: Canonical Byzantine build
        run: PYTHONPATH=LearnerAI python tools/build_byzantine_bot.py

      - name: Full compiler regression suite
        env:
          PYTHONPATH: LearnerAI
        run: python -m unittest discover -s LearnerAI/Compiler/tests -p "test_*.py"

      - name: Native zero-findings on generated artifact
        run: python LearnerAI/Compiler/tests/assert_native_zero.py dist/byzantine/Byzantine.per --report /tmp/byzantine-generated-native.json

      - name: Endgame artifact contract audit
        run: |
          python - <<'PY'
          from pathlib import Path

          artifact = Path("dist/byzantine/Byzantine.per").read_text(encoding="utf-8")

          required = {
              "imperial band state": "byzantine-imperial-band-state",
              "standing -> open": "byzantine-imperial-band-transition-open",
              "open -> fortified": "byzantine-imperial-band-transition-fortified",
              "open -> trash": "byzantine-imperial-band-transition-trash",
              "floor 18 halberdiers": "(unit-type-count halberdier < 18)",
              "floor 18 elite skirmishers": "(unit-type-count 6 < 18)",
              "floor 12 hussars": "(unit-type-count hussar < 12)",
              "endgame attack band gate": "(up-compare-goal byzantine-imperial-band-state != 0)",
          }
          for label, needle in required.items():
              if needle not in artifact:
                  raise SystemExit(f"missing generated artifact contract: {label}: {needle}")

          forbidden = {
              "legacy 8-halberdier floor": "bt-imperial-halberdier-floor",
              "legacy manual composition posture": "byzantine-imperial-composition-posture",
          }
          for label, needle in forbidden.items():
              if needle in artifact:
                  raise SystemExit(f"stale manual policy survived canonical regeneration: {label}: {needle}")

          print("generated Byzantine artifact contract: OK")
          PY

      - name: Compare generated artifact with checked-in runtime artifact
        run: |
          cp dist/byzantine/Byzantine.per /tmp/Byzantine.generated.per
          if cmp -s /tmp/Byzantine.generated.per Byzantine.per; then
            echo "Byzantine.per already matches canonical build."
          else
            git diff --no-index --stat Byzantine.per /tmp/Byzantine.generated.per || true
            git diff --no-index --numstat Byzantine.per /tmp/Byzantine.generated.per || true
            echo "Canonical artifact differs from checked-in Byzantine.per; replacing stale runtime artifact."
            cp /tmp/Byzantine.generated.per Byzantine.per
          fi

      - name: Native zero-findings on checked-in replacement
        run: python LearnerAI/Compiler/tests/assert_native_zero.py Byzantine.per --report /tmp/byzantine-checked-in-native.json

      - name: Commit regenerated artifact
        shell: bash
        run: |
          if git diff --quiet -- Byzantine.per; then
            echo "No Byzantine.per change to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Byzantine.per
          git commit -m "sync: regenerate Byzantine.per from canonical compiler"
          git push origin HEAD:sync/byzantine-per-endgame-20261005
