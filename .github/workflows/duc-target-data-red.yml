name: DUC target data focused

on:
  push:
    branches:
      - compiler-duc-target-data-readers

jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Focused DUC target-data tests
        shell: bash
        run: |
          set -e
          PYTHONPATH=LearnerAI python -m unittest -v LearnerAI.Compiler.tests.test_duc_semantics.DucSemanticTests.test_get_object_data_requires_selected_target
          PYTHONPATH=LearnerAI python -m unittest -v LearnerAI.Compiler.tests.test_duc_semantics.DucSemanticTests.test_get_object_data_reads_current_selected_object_and_writes_goal_span
          PYTHONPATH=LearnerAI python -m unittest -v LearnerAI.Compiler.tests.test_duc_semantics.DucSemanticTests.test_object_data_fact_reads_current_selected_object
          PYTHONPATH=LearnerAI python -m unittest -v LearnerAI.Compiler.tests.test_duc_semantics.DucSemanticTests.test_get_object_target_data_exposes_runtime_target_of_target_boundary
          PYTHONPATH=LearnerAI python -m unittest -v LearnerAI.Compiler.tests.test_duc_semantics.DucSemanticTests.test_get_object_data_rejects_stale_selected_target
          PYTHONPATH=LearnerAI python -m unittest -v LearnerAI.Compiler.tests.test_duc_semantics.DucSemanticTests.test_get_object_data_preserves_native_id_liveness_boundary
          PYTHONPATH=LearnerAI python -m unittest -v LearnerAI.Compiler.tests.test_duc_semantics.DucSemanticTests.test_get_object_target_data_preserves_native_id_and_warns_target_of_target
          PYTHONPATH=LearnerAI python -m unittest -v LearnerAI.Compiler.tests.test_duc_semantics.DucSemanticTests.test_get_object_data_goal_id_out_of_range_is_diagnostic
          PYTHONPATH=LearnerAI python -m unittest -v LearnerAI.Compiler.tests.test_duc_semantics.DucSemanticTests.test_get_object_data_overwrites_previous_goal_writer_with_provenance
          PYTHONPATH=LearnerAI python -m unittest -v LearnerAI.Compiler.tests.test_duc_semantics.DucSemanticTests.test_get_object_data_fact_writes_goal_output_span
          PYTHONPATH=LearnerAI python -m unittest -v LearnerAI.Compiler.tests.test_duc_semantics.DucSemanticTests.test_cross_pass_target_data_reuse_warns_syntactic_retention
          PYTHONPATH=LearnerAI python -m unittest -v LearnerAI.Compiler.tests.test_native_contract_integration.NativeContractIntegrationTests.test_shared_catalog_exposes_duc_contracts_and_evidence_ids
          PYTHONPATH=LearnerAI python -m unittest -v LearnerAI.Compiler.tests.test_native_hygiene.NativeHygieneTests.test_default_native_citation_catalog_is_complete_and_promotable