name: age-transition-liveness-focused

on:
  push:
    branches:
      - fix/age-transition-liveness

jobs:
  focused:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: LearnerAI
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install pinned native parser
        run: python -m pip install "git+https://github.com/joerollman/aoe2-ai-parser.git@3dfa2583b7c2ec36b85ccb421ebd0abe9ff276ba"
      - name: Focused age-transition tests
        run: |
          python -m unittest \
            LearnerAI.Compiler.tests.test_strategy_opening_economy.ByzantineStrategyControlSliceTests.test_castle_age_transition_executes_from_native_feasibility_only \
            LearnerAI.Compiler.tests.test_strategy_opening_economy.ByzantineStrategyControlSliceTests.test_imperial_age_transition_executes_from_native_feasibility_only \
            -v
