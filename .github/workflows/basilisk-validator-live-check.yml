name: Basilisk live validator self-test

on:
  push:

jobs:
  validator-selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run Basilisk validator self-test
        run: node validation/basilisk-validator-selftest.js
