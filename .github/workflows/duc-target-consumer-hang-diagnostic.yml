name: DUC target consumer hang diagnostic

on:
  push:
    branches:
      - compiler-duc-target-consumer

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run verbose compiler suite with hard timeout
        shell: bash
        run: |
          set -o pipefail
          timeout 120s python -m unittest discover -v -s LearnerAI/Compiler/tests -p "test_*.py" 2>&1 | tee verbose.log
      - name: Upload verbose log
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: duc-target-consumer-hang-diagnostic
          path: verbose.log