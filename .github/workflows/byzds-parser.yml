name: BYZDS Parser

on:
  push:
    paths:
      - "tools/byzds_parser.py"
      - "tests/test_byzds_parser.py"
      - "tests/fixtures/byzds-ci.log"
      - "docs/runtime/byzds-cross-event-constraints-v1.json"
      - "docs/runtime/byzds-parser-result-v1.schema.json"
      - ".github/workflows/byzds-parser.yml"
  pull_request:
    paths:
      - "tools/byzds_parser.py"
      - "tests/test_byzds_parser.py"
      - "tests/fixtures/byzds-ci.log"
      - "docs/runtime/byzds-cross-event-constraints-v1.json"
      - "docs/runtime/byzds-parser-result-v1.schema.json"
      - ".github/workflows/byzds-parser.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: BYZDS parser tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Run BYZDS parser tests
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_byzds_parser.py' -v 2>&1 | tee byzds-test-output.txt

      - name: Report deterministic result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f byzds-test-output.txt ]]; then
            result=INFRA_ERROR
            tests=0
          else
            if grep -q '^OK$' byzds-test-output.txt; then
              result=PASS
            elif grep -q '^FAILED' byzds-test-output.txt; then
              result=FAIL
            else
              result=INFRA_ERROR
            fi

            tests=$(grep -oE '^Ran [0-9]+ tests? in ' byzds-test-output.txt | grep -oE '[0-9]+' | tail -1 || true)
            tests=${tests:-0}
          fi

          printf '{"result":"%s","test_count":%s}\n' "$result" "$tests" > byzds-result.json

          {
            echo "## BYZDS parser"
            echo
            echo "| Result | Tests |"
            echo "|---|---:|"
            echo "| \`$result\` | $tests |"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "BYZDS_RESULT=$result"
          echo "BYZDS_TEST_COUNT=$tests"

          if [[ "$result" != "PASS" ]]; then
            exit 1
          fi

      - name: Generate deterministic parser JSON
        if: always()
        shell: bash
        run: |
          set -uo pipefail

          if python -m tools.byzds_parser \
              docs/runtime/byzds-cross-event-constraints-v1.json \
              tests/fixtures/byzds-ci.log > byzds-parser-report.json; then
            parser_status=0
          else
            parser_status=$?
          fi

          python - <<'PY'
          import json
          from pathlib import Path

          base = json.loads(Path("byzds-result.json").read_text(encoding="utf-8"))
          report_path = Path("byzds-parser-report.json")

          if report_path.exists():
              try:
                  report = json.loads(report_path.read_text(encoding="utf-8"))
              except (json.JSONDecodeError, OSError):
                  report = None
          else:
              report = None

          if not isinstance(report, dict):
              report = {
                  "cases": [],
                  "matrix": {
                      "result": "INFRA_ERROR",
                      "case_count": 0,
                      "result_counts": {
                          "PASS": 0,
                          "FAIL": 0,
                          "INVALID": 0,
                          "INFRA_ERROR": 0
                      },
                      "constraint_counts": {}
                  }
              }

          artifact = {
              "schema_version": "1",
              "result": base["result"],
              "test_count": base["test_count"],
              "cases": report.get("cases", []),
              "matrix": report.get("matrix", {
                  "result": "INFRA_ERROR",
                  "case_count": 0,
                  "result_counts": {
                      "PASS": 0,
                      "FAIL": 0,
                      "INVALID": 0,
                      "INFRA_ERROR": 0
                  },
                  "constraint_counts": {}
              })
          }

          if parser_status != 0:
              artifact["matrix"]["result"] = "INFRA_ERROR"

          Path("byzds-result.json").write_text(
              json.dumps(artifact, sort_keys=True, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )
          PY

          python -m json.tool byzds-result.json > /dev/null

      - name: Verify BYZDS artifact schema version
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          schema = json.loads(Path("docs/runtime/byzds-parser-result-v1.schema.json").read_text(encoding="utf-8"))
          artifact = json.loads(Path("byzds-result.json").read_text(encoding="utf-8"))

          expected = schema["properties"]["schema_version"]["const"]
          actual = artifact.get("schema_version")
          if actual != expected:
              raise SystemExit(
                  f"BYZDS_SCHEMA_VERSION_MISMATCH: artifact={actual!r} schema={expected!r}"
              )

          print(f"BYZDS_SCHEMA_VERSION=PASS ({actual})")
          PY

      - name: Validate BYZDS JSON artifact
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input "jsonschema==4.25.1"
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator

          schema = json.loads(Path("docs/runtime/byzds-parser-result-v1.schema.json").read_text(encoding="utf-8"))
          artifact = json.loads(Path("byzds-result.json").read_text(encoding="utf-8"))
          Draft202012Validator.check_schema(schema)
          Draft202012Validator(schema).validate(artifact)
          print("BYZDS_JSON_SCHEMA=PASS")
          PY

      - name: Upload BYZDS result artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: byzds-parser-result
          path: byzds-result.json
          if-no-files-found: error
          retention-days: 14
