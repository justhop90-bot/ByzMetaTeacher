name: BYZDS Parser

on:
  push:
    paths:
      - "tools/byzds_parser.py"
      - "tests/test_byzds_parser.py"
      - "docs/runtime/byzds-cross-event-constraints-v1.json"
      - ".github/workflows/byzds-parser.yml"
  pull_request:
    paths:
      - "tools/byzds_parser.py"
      - "tests/test_byzds_parser.py"
      - "docs/runtime/byzds-cross-event-constraints-v1.json"
      - ".github/workflows/byzds-parser.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: BYZDS parser tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Run BYZDS parser tests
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_byzds_parser.py' -v 2>&1 | tee byzds-test-output.txt

      - name: Report deterministic result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f byzds-test-output.txt ]]; then
            echo "BYZDS_RESULT=INFRA_ERROR" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if grep -q '^OK$' byzds-test-output.txt; then
            result=PASS
          elif grep -q '^FAILED' byzds-test-output.txt; then
            result=FAIL
          else
            result=INFRA_ERROR
          fi

          tests=$(grep -oE '^Ran [0-9]+ tests? in ' byzds-test-output.txt | grep -oE '[0-9]+' | tail -1 || true)
          tests=${tests:-0}

          {
            echo "## BYZDS parser"
            echo
            echo "| Result | Tests |"
            echo "|---|---:|"
            echo "| \`$result\` | $tests |"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "BYZDS_RESULT=$result"
          echo "BYZDS_TEST_COUNT=$tests"

          if [[ "$result" != "PASS" ]]; then
            exit 1
          fi
