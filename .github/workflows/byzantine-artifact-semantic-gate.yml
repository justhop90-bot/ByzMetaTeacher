name: Byzantine artifact semantic gate

on:
  pull_request:
    paths:
      - "Byzantine.per"
      - "LearnerAI/Compiler/tests/test_byzantine_defensive_geometry.py"
      - ".github/workflows/byzantine-artifact-semantic-gate.yml"

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned AoE2 AI parser
        run: python -m pip install "git+https://github.com/joerollman/aoe2-ai-parser.git@3dfa2583b7c2ec36b85ccb421ebd0abe9ff276ba"
      - name: Native parser
        run: python -m aoe2_ai_lab lint Byzantine.per
      - name: Byzantine artifact semantic test
        run: python -m unittest LearnerAI.Compiler.tests.test_byzantine_defensive_geometry -v
      - name: Reject direct goal comparator facts
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          text = Path("Byzantine.per").read_text(encoding="utf-8")
          bad = re.findall(r"\\(goal\\s+[^\\s()]+\\s+(?:==|!=|<=|>=|<|>)\\s+[^()]+\\)", text)
          assert not bad, bad
          print("direct goal comparator facts: 0")
          PY
