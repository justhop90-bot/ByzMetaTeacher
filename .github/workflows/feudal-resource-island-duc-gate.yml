name: Feudal resource-island DUC gate

on:
  push:
    branches:
      - runtime/pacific-gold-bootstrap-20261007
    paths:
      - "LearnerAI/Compiler/ir/water.py"
      - "LearnerAI/Compiler/ir/strategy.py"
      - "LearnerAI/Compiler/ir/community_strategy_packs.py"
      - "LearnerAI/Compiler/tests/test_water_transport_execution.py"
      - "LearnerAI/Compiler/tests/test_water_map_v1.py"
      - "LearnerAI/Compiler/tests/test_community_strategy_packs.py"
      - "LearnerAI/Compiler/tests/test_strategy_compiler_integration.py"
      - "tools/synchronize_byzantine_runtime.py"
      - "tools/build_byzantine_bot.py"
      - "LearnerAI/Compiler/tests/assert_native_zero.py"
  pull_request:
    paths:
      - "LearnerAI/Compiler/ir/water.py"
      - "LearnerAI/Compiler/ir/strategy.py"
      - "LearnerAI/Compiler/ir/community_strategy_packs.py"
      - "LearnerAI/Compiler/tests/test_water_transport_execution.py"
      - "LearnerAI/Compiler/tests/test_strategy_compiler_integration.py"
      - "tools/synchronize_byzantine_runtime.py"
      - "tools/build_byzantine_bot.py"
      - "LearnerAI/Compiler/tests/assert_native_zero.py"

permissions:
  contents: read

concurrency:
  group: feudal-resource-island-duc-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Feudal resource-island DUC
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: LearnerAI
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install pinned native parser
        run: python -m pip install "git+https://github.com/joerollman/aoe2-ai-parser.git@3dfa2583b7c2ec36b85ccb421ebd0abe9ff276ba"

      - name: Canonical Byzantine Core v1 build
        run: PYTHONPATH=LearnerAI python tools/build_byzantine_bot.py

      - name: Focused Feudal resource-island DUC regression
        run: |
          python -m unittest \
            LearnerAI.Compiler.tests.test_water_transport_execution.WaterTransportExecutionTests.test_feudal_resource_island_transport_state_is_feudal_and_fail_closed \
            LearnerAI.Compiler.tests.test_strategy_compiler_integration.StrategyCompilerIntegrationTests.test_stock_strategy_lowers_feudal_resource_island_duc_target_handoff \
            -v

      - name: Focused Pacific Harbor Defense Controller regression
        run: |
          python -m unittest \
            LearnerAI.Compiler.tests.test_water_transport_execution.WaterTransportExecutionTests.test_pacific_harbor_defense_controller_owns_pressure_and_dock_arbitration \
            LearnerAI.Compiler.tests.test_water_transport_execution.WaterTransportExecutionTests.test_pacific_harbor_defense_gates_transport_and_preserves_escrow_naval_production \
            LearnerAI.Compiler.tests.test_water_transport_execution.WaterTransportExecutionTests.test_pacific_harbor_defense_closes_transport_execution_while_pressure_is_active \
            LearnerAI.Compiler.tests.test_community_strategy_packs.ByzantineCommunityStrategyPackTests.test_pacific_harbor_defense_gates_naval_demands_on_pacific \
            -v

      - name: Focused Pacific Transport Recovery regression
        run: |
          python -m unittest \
            LearnerAI.Compiler.tests.test_water_transport_execution.WaterTransportExecutionTests.test_pacific_transport_recovery_retains_a_post_landing_rebuild_entitlement \
            LearnerAI.Compiler.tests.test_water_transport_execution.WaterTransportExecutionTests.test_pacific_transport_recovery_demand_uses_dock_pressure_and_escrow \
            LearnerAI.Compiler.tests.test_community_strategy_packs.ByzantineCommunityStrategyPackTests.test_pacific_transport_recovery_is_a_standing_feudal_capability_after_landing \
            -v

      - name: Focused Pacific Transport Escort coordination regression
        run: |
          python -m unittest             LearnerAI.Compiler.tests.test_water_transport_execution.WaterTransportExecutionTests.test_pacific_transport_escort_is_typed_and_blocks_unescorted_feudal_transport             LearnerAI.Compiler.tests.test_water_transport_execution.WaterTransportExecutionTests.test_pacific_transport_escort_uses_existing_fire_galley_escrow_channel             LearnerAI.Compiler.tests.test_water_transport_execution.WaterTransportExecutionTests.test_pacific_transport_escort_controller_closes_feudal_transport_when_escort_is_lost             LearnerAI.Compiler.tests.test_community_strategy_packs.ByzantineCommunityStrategyPackTests.test_pacific_transport_escort_is_a_standing_feudal_support_capability             -v

      - name: Focused Pacific Convoy Routing regression
        run: |
          python -m unittest             LearnerAI.Compiler.tests.test_water_transport_execution.WaterTransportExecutionTests.test_pacific_convoy_route_owns_transport_and_escort_dispatch             LearnerAI.Compiler.tests.test_strategy_compiler_integration.StrategyCompilerIntegrationTests.test_byzantine_stock_emits_pacific_convoy_route_against_shared_gold_point             -v

      - name: Focused Pacific Convoy Fallback regression
        run: |
          python -m unittest             LearnerAI.Compiler.tests.test_water_transport_execution.WaterTransportExecutionTests.test_pacific_convoy_route_falls_back_without_releasing_convoy_intent             -v

      - name: Native zero-findings acceptance - canonical Byzantine artifact
        run: python LearnerAI/Compiler/tests/assert_native_zero.py dist/byzantine/Byzantine.per --report /tmp/native-byzantine.json
