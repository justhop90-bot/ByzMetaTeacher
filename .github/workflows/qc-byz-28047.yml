name: Temporary Byzantine 28047 QC
on:
  push:
    branches:
      - fix/byz-imperial-ranged-line-ids-20261005
permissions:
  contents: read
jobs:
  qc:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install pinned native parser
        run: python -m pip install "git+https://github.com/joerollman/aoe2-ai-parser.git@3dfa2583b7c2ec36b85ccb421ebd0abe9ff276ba"
      - name: Verify emitted Imperial ranged guards
        env:
          PYTHONPATH: LearnerAI
        run: |
          python - <<'PY'
          from pathlib import Path
          from LearnerAI.Compiler.clients.basilisk import ByzantineProfile, build_byzantine_strategy
          from LearnerAI.Compiler.ir.civ_profile import resolve_effective_civ
          from LearnerAI.Compiler.clients.basilisk import compile_strategy_profile
          effective = resolve_effective_civ(ByzantineProfile.for_update_185872())
          profile = build_byzantine_strategy(effective)
          emitted = compile_strategy_profile(profile, effective)
          assert "(players-unit-type-count any-enemy archer-line >= 8)" in emitted
          assert "(players-unit-type-count any-enemy archer-line >= 12)" in emitted
          assert "crossbow-line" not in emitted
          print("emission guard: OK")
          PY
      - name: Verify native camel rider line lowering
        env:
          PYTHONPATH: LearnerAI
        run: |
          python - <<'PY'
          from LearnerAI.Compiler.compiler import compile_source
          source = """
          demand camel-line-observation {
              require (unit-type-count-total camel-rider-line < 3)
              require (players-unit-type-count any-enemy camel-rider-line >= 8)
              action (build castle)
              witness (building-type-count castle > 0)
              release (building-type-count castle > 0)
          }
          """
          output = compile_source(source)
          assert "(unit-type-count-total camel-line < 3)" in output
          assert "(players-unit-type-count any-enemy camel-line >= 8)" in output
          assert "camel-rider-line" not in output
          print("native camel line lowering: OK")
          PY

      - name: Verify checked-in artifact around 28047
        run: |
          python - <<'PY'
          from pathlib import Path
          lines=Path("Byzantine.per").read_text(encoding="utf-8").splitlines()
          line=lines[28046]
          assert "players-unit-type-count any-enemy archer-line >= 8" in line
          assert "crossbow-line" not in line
          assert sum("crossbow-line" in x for x in lines) == 0
          assert "camel-line" in lines[28266]
          assert "camel-rider-line" not in lines[28266]
          assert "camel-line" in lines[28339]
          assert "camel-rider-line" not in lines[28339]
          assert sum("camel-rider-line" in x for x in lines) == 0
          print("artifact line 28047:", line)
          print("artifact line 28267:", lines[28266])
          print("artifact line 28340:", lines[28339])
          PY
      - name: Native zero-findings on checked-in artifact
        run: python LearnerAI/Compiler/tests/assert_native_zero.py Byzantine.per --report /tmp/native-byz.json
      - name: Focused community strategy regression
        run: PYTHONPATH=LearnerAI python -m unittest LearnerAI.Compiler.tests.test_community_strategy_packs -v
      - name: Full compiler regression suite
        run: PYTHONPATH=LearnerAI python -m unittest discover -s LearnerAI/Compiler/tests -p "test_*.py"
