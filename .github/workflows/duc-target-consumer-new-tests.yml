name: DUC target consumer new tests

on:
  push:
    branches:
      - compiler-duc-target-consumer

jobs:
  new-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run new DUC tests individually
        shell: bash
        run: |
          set -e
          tests=(
            "LearnerAI.Compiler.tests.test_duc_semantics.DucSemanticTests.test_target_objects_option_zero_uses_local_list_without_selected_target"
            "LearnerAI.Compiler.tests.test_duc_semantics.DucSemanticTests.test_target_objects_option_zero_requires_local_search_state"
            "LearnerAI.Compiler.tests.test_duc_semantics.DucSemanticTests.test_target_objects_option_one_consumes_selected_object_target"
            "LearnerAI.Compiler.tests.test_duc_semantics.DucSemanticTests.test_target_objects_rejects_invalid_option"
            "LearnerAI.Compiler.tests.test_duc_semantics.DucSemanticTests.test_sort_invalidates_list_index_target_before_selected_only_targeting"
            "LearnerAI.Compiler.tests.test_duc_semantics.DucSemanticTests.test_target_objects_option_zero_records_local_search_consumer_effect"
            "LearnerAI.Compiler.tests.test_duc_semantics.DucSemanticTests.test_target_objects_option_one_records_selected_target_consumer_effect"
            "LearnerAI.Compiler.tests.test_duc_semantics.DucSemanticTests.test_target_objects_option_one_allows_direct_native_id_but_warns_liveness"
            "LearnerAI.Compiler.tests.test_duc_semantics.DucSemanticTests.test_target_objects_option_zero_requires_local_search_but_not_selected_target"
          )
          for test_id in "${tests[@]}"; do
            echo "=== $test_id ==="
            PYTHONPATH=LearnerAI timeout 15s python -m unittest -v "$test_id"
          done